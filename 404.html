<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Not found | Logan Grass</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#1e1e2e">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css?v=15">
  </head>
  <body>
    <main id="main" class="not-found">
      <p class="t-line t-cmd"><span class="t-ps1">logan@la:~$</span> cd <span id="missing-path">this page</span></p>
      <p class="t-line t-warn">no such file or directory</p>
      <h1>Nothing lives at this address.</h1>
      <p class="intro">The link may be old, or the page moved when the site was reorganised. Everything still lives on the home page.</p>
      <div class="actions">
        <a class="button primary" href="/">Back to logangrass.com</a>
        <a class="text-link" href="/#contact">or report the broken link</a>
      </div>
    </main>
    <script>
      // Show the requested path as text only; never as HTML.
      try {
        const path = decodeURIComponent(window.location.pathname).slice(0, 80);
        if (path && path !== "/404.html") document.getElementById("missing-path").textContent = path;
      } catch {
        // Malformed escapes keep the generic wording.
      }
    </script>
  </body>
</html>
